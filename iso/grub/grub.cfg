set default=0
set timeout=5

menuentry "Ubuntu Gaming" {
    linux /casper/vmlinuz boot=casper quiet splash ---
    initrd /casper/initrd
}

menuentry "Ubuntu Gaming (safe graphics)" {
    linux /casper/vmlinuz boot=casper nomodeset ---
    initrd /casper/initrd
}

menuentry "Ubuntu Gaming (CI boot validation)" {
    linux /casper/vmlinuz boot=casper ubuntu-gaming.ci console=ttyS0,115200n8 ---
    initrd /casper/initrd
}
