name: Build ISO

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "config/**"
      - "iso/**"
      - "scripts/build-rootfs.sh"
      - "scripts/build-iso.sh"
      - ".github/workflows/build-iso.yml"

permissions:
  contents: read

concurrency:
  group: iso-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install image tooling
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            mmdebstrap squashfs-tools grub-pc-bin grub-efi-amd64-bin \
            grub2-common xorriso mtools qemu-system-x86 ovmf

      - name: Build rootfs
        run: sudo bash ./scripts/build-rootfs.sh

      - name: Build ISO
        run: sudo bash ./scripts/build-iso.sh

      - name: Validate ISO structure
        run: |
          test -s build/ubuntu-gaming-amd64.iso
          test -s build/ubuntu-gaming-amd64.iso.sha256
          xorriso -indev build/ubuntu-gaming-amd64.iso -find /casper -type f -exec lsdl
          xorriso -indev build/ubuntu-gaming-amd64.iso -find /boot/grub/grub.cfg -type f -exec lsdl
          sha256sum --check build/ubuntu-gaming-amd64.iso.sha256

      - name: QEMU firmware smoke test
        run: |
          timeout 25s qemu-system-x86_64 \
            -machine q35,accel=tcg \
            -m 2048 \
            -smp 2 \
            -cdrom build/ubuntu-gaming-amd64.iso \
            -boot d \
            -display none \
            -serial stdio \
            -no-reboot || status=$?
          if [[ ${status:-0} -ne 0 && ${status:-0} -ne 124 ]]; then
            exit "${status}"
          fi

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-gaming-amd64-iso
          path: |
            build/ubuntu-gaming-amd64.iso
            build/ubuntu-gaming-amd64.iso.sha256
          if-no-files-found: error
          retention-days: 7
